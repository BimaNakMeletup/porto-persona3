<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Persona 3 Reload - About Background</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #06121e;
    font-family: "Orbitron", system-ui, -apple-system, sans-serif;
    color: #fff;
  }

  /* ===== FULLSCREEN CONTAINER (OPTIMIZED WITH CSS CONTAINMENT) ===== */
  .p3r-about {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    background: #14c1f9;
    isolation: isolate;
    contain: strict;
  }
  .p3r-about svg,
  .p3r-about__char-wrap {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
  }

  /* ===== 1. ELEGANT CONCENTRIC ARCS (STATIC CLEAN GPU LAYER) ===== */
  .p3r-arcs-group {
    transform-origin: 665px -20px;
  }

  /* Thin Sonar Pulse Rings (GPU scale3d & opacity - 0% CPU repaint) */
  .p3r-sonar-ring {
    transform-origin: 665px -20px;
    will-change: transform, opacity;
    animation: p3r-sonar-pulse 8s cubic-bezier(0.1, 0.7, 0.2, 1) infinite;
  }
  .p3r-sonar-ring:nth-child(2) { animation-delay: 2s; }
  .p3r-sonar-ring:nth-child(3) { animation-delay: 4s; }
  .p3r-sonar-ring:nth-child(4) { animation-delay: 6s; }

  @keyframes p3r-sonar-pulse {
    0% {
      transform: scale3d(0.15, 0.15, 1);
      stroke-width: 4px;
      stroke: #5ce8ff;
      opacity: 0.9;
    }
    50% {
      stroke: #00b4d8;
      opacity: 0.55;
    }
    100% {
      transform: scale3d(1.85, 1.85, 1);
      stroke-width: 1px;
      stroke: #007799;
      opacity: 0;
    }
  }

  /* ===== 3. KARAKTER MAKOTO YUKI (FLOATING HALUS & ANCHORED) ===== */
  .p3r-about__char-wrap {
    position: absolute;
    left: 0;
    right: 0;
    top: 3.5%;
    bottom: -3.5%;
    height: 100%;
    pointer-events: none;
    z-index: 5;
    will-change: transform;
    animation: p3r-subtle-float 4.8s ease-in-out infinite alternate;
  }

  @keyframes p3r-subtle-float {
    0% {
      transform: translate3d(0, 0, 0);
    }
    100% {
      transform: translate3d(0, -4px, 0);
    }
  }

  .p3r-about__char {
    position: absolute;
    right: 0;
    bottom: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: right bottom;
    pointer-events: none;
    user-select: none;
  }
  /* Responsive Tablet & Mobile (Karakter Utuh Tanpa Terpotong) */
  @media (max-width: 1024px) {
    .p3r-about__char-wrap {
      position: absolute;
      right: 0;
      bottom: 0;
      width: 100%;
      height: 100%;
      top: auto;
      pointer-events: none;
    }
    .p3r-about__char {
      position: absolute;
      right: -4%;
      bottom: 0;
      height: 68vh;
      max-height: 700px;
      width: auto;
      max-width: none;
      object-fit: contain;
      transform: none;
    }
  }
  @media (max-width: 767px) {
    .p3r-about__char {
      right: -8%;
      bottom: -2%;
      height: 52vh;
      max-height: 460px;
      opacity: 0.75;
    }
  }

  /* ===== 4. FLOATING TRIANGLE SHARDS (GPU Accelerated) ===== */
  .p3r-shard {
    transform-box: fill-box;
    transform-origin: center center;
    will-change: transform, opacity;
    animation: p3r-shard-drift 3.8s ease-in-out infinite;
  }

  @keyframes p3r-shard-drift {
    0%, 100% {
      transform: translate3d(0, 0, 0) rotate(0deg);
      opacity: 0.75;
    }
    50% {
      transform: translate3d(var(--tx, -10px), var(--ty, -22px), 0) rotate(var(--rot, 20deg));
      opacity: 0.35;
    }
  }

  /* ===== 5. MP3 PLAYER / EVOKER HOLSTER NEON GLOW ===== */
  .p3r-mp3-glow {
    transform-origin: 535px 415px;
    will-change: opacity;
    animation: p3r-neon-pulse 2s ease-in-out infinite alternate;
  }
  @keyframes p3r-neon-pulse {
    0% {
      opacity: 0.65;
    }
    100% {
      opacity: 1;
    }
  }

  /* ===== 6. INTERACTIVE CLICK RIPPLES ===== */
  .p3r-click-layer {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    overflow: hidden;
    z-index: 20;
  }

  .p3r-click-circle {
    position: absolute;
    border-radius: 50%;
    pointer-events: none;
    border: 2px solid #5ce8ff;
    box-shadow: 0 0 16px rgba(0, 229, 255, 0.85), inset 0 0 12px rgba(0, 229, 255, 0.45);
    transform: translate3d(-50%, -50%, 0);
    animation: p3r-click-expand 0.95s cubic-bezier(0.12, 0.8, 0.25, 1) forwards;
    will-change: transform, opacity;
  }

  .p3r-click-circle::before {
    content: "";
    position: absolute;
    inset: 12px;
    border-radius: 50%;
    border: 1.5px solid rgba(160, 240, 255, 0.75);
  }

  @keyframes p3r-click-expand {
    0% {
      width: 30px;
      height: 30px;
      opacity: 0.95;
      border-width: 3.5px;
    }
    60% {
      opacity: 0.65;
    }
    100% {
      width: 360px;
      height: 360px;
      opacity: 0;
      border-width: 1px;
    }
  }
</style>
</head>
<body>

<section class="p3r-about" aria-label="Persona 3 Reload - About Background Frame">

  <!-- Layer 1: Background SVG (Gradasi Cyan Asli + Sabuk Teal Otentik + Gelombang Sonar + Shadow Persona) -->
  <svg class="p3r-about__back" viewBox="0 0 1280 720" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
    <defs>
      <!-- Base Cyan/Turquoise Gradient -->
      <linearGradient id="p3r-about-base" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#1ec8f0"/>
        <stop offset="0.55" stop-color="#14b5dc"/>
        <stop offset="1" stop-color="#0e96b6"/>
      </linearGradient>
      <!-- Tekstur Halftone Grid Pattern (Optimized) -->
      <pattern id="p3r-about-dots" width="16" height="16" patternUnits="userSpaceOnUse">
        <circle cx="8" cy="8" r="1.6" fill="#014a60"/>
      </pattern>
      <radialGradient id="p3r-dots-mask-grad" cx="0.32" cy="0.45" r="0.75">
        <stop offset="0%" stop-color="#fff" stop-opacity="0.85"/>
        <stop offset="60%" stop-color="#fff" stop-opacity="0.4"/>
        <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
      </radialGradient>
      <mask id="p3r-about-texture-mask">
        <rect width="1280" height="720" fill="url(#p3r-dots-mask-grad)"/>
      </mask>
    </defs>

    <!-- Base Canvas Background -->
    <rect width="1280" height="720" fill="url(#p3r-about-base)"/>

    <!-- Lingkaran Konsentris Otentik P3R (Sabuk Teal Solid Asli) -->
    <g class="p3r-arcs-group">
      <!-- Cincin Teal Dalam (Radius 220 s/d 610) -->
      <path d="M 665 -20 M 445 -20 A 220 220 0 1 0 885 -20 A 220 220 0 1 0 445 -20 Z
               M 55 -20 A 610 610 0 1 1 1275 -20 A 610 610 0 1 1 55 -20 Z"
            fill="#0080a9" fill-opacity="0.9" fill-rule="evenodd"/>

      <!-- Cincin Teal Luar (Radius 950 s/d 1400) -->
      <path d="M 665 -20 M -285 -20 A 950 950 0 1 0 1615 -20 A 950 950 0 1 0 -285 -20 Z
               M -735 -20 A 1400 1400 0 1 1 2065 -20 A 1400 1400 0 1 1 -735 -20 Z"
            fill="#007296" fill-opacity="0.55" fill-rule="evenodd"/>

      <!-- Garis Busur Tipis Aksen -->
      <circle cx="665" cy="-20" r="460" fill="none" stroke="#004866" stroke-width="2.5" opacity="0.75"/>
      <circle cx="665" cy="-20" r="800" fill="none" stroke="#5ce8ff" stroke-width="1.8" opacity="0.65"/>
    </g>

    <!-- Cincin Sonar Halus yang Membesar (Expanding Sonar Pulse - Halus & Rapi) -->
    <g id="p3rSonarPulse">
      <circle cx="665" cy="-20" r="600" fill="none" class="p3r-sonar-ring"/>
      <circle cx="665" cy="-20" r="600" fill="none" class="p3r-sonar-ring"/>
      <circle cx="665" cy="-20" r="600" fill="none" class="p3r-sonar-ring"/>
      <circle cx="665" cy="-20" r="600" fill="none" class="p3r-sonar-ring"/>
    </g>

    <!-- Tekstur Halftone Grid (Menggantikan siluet lama agar latar belakang bersih & berdimensi) -->
    <rect width="1280" height="720" fill="url(#p3r-about-dots)" mask="url(#p3r-about-texture-mask)" opacity="0.8"/>

    <!-- Garis lengkung tipis di belakang karakter -->
    <path d="M -50 360 Q 640 60 1350 420" fill="none" stroke="#004e66" stroke-width="2.5" opacity="0.75"/>
  </svg>

  <!-- Layer 2: Karakter Makoto Yuki (about-char.png - Floating Halus, Anchored Rapi di Bawah) -->
  <!-- Layer 2: Karakter Makoto Yuki (Optimized WebP with PNG Fallback & Async Decode) -->
  <div class="p3r-about__char-wrap">
    <picture>
      <source srcset="about-char.webp" type="image/webp">
      <img class="p3r-about__char" src="about-char.png" alt="Persona 3 Reload Protagonist - About" decoding="async" fetchpriority="high">
    </picture>
  <!-- Layer 3: Foreground Shards & Glowing MP3 Light -->
  <svg class="p3r-about__front" viewBox="0 0 1280 720" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
    <!-- Sorot Cahaya Hijau Neon pada MP3 Player / Holster -->
    <g class="p3r-mp3-glow">
      <ellipse cx="538" cy="416" rx="20" ry="8" fill="#00ffc4" opacity="0.85"/>
      <ellipse cx="538" cy="416" rx="10" ry="4" fill="#ffffff" opacity="0.95"/>
    </g>

    <!-- Serpihan Segitiga Melayang (Floating Shards) -->
    <g id="p3rAboutShards" fill="#7be9ff"></g>
  </svg>

  <!-- Layer 4: Interactive Click Ripples -->
  <div class="p3r-click-layer" id="p3rClickLayer"></div>
</section>

<script>
(() => {
  const NS = "http://www.w3.org/2000/svg";
  let seed = 42;
  const rnd = () => ((seed = (seed * 16807) % 2147483647) - 1) / 2147483646;

  // 1. Serpihan segitiga melayang & berputar (About Shards)
  // 1. Serpihan segitiga melayang & berputar (Batched with DocumentFragment for zero reflow)
  const shardsContainer = document.getElementById("p3rAboutShards");
  const fragment = document.createDocumentFragment();
  for (let i = 0; i < 30; i++) {
    const cx = 150 + rnd() * 1050;
    const cy = 60 + rnd() * 600;
    const s = 4 + rnd() * 12;
    const a = rnd() * Math.PI * 2;
    const pt = [0, 2.2, 4.2].map(k => (cx + s * Math.cos(a + k)).toFixed(1) + "," + (cy + s * Math.sin(a + k)).toFixed(1));

    const poly = document.createElementNS(NS, "polygon");
    poly.setAttribute("points", pt.join(" "));
    poly.setAttribute("fill-opacity", (0.35 + rnd() * 0.55).toFixed(2));
    poly.setAttribute("class", "p3r-shard");

    poly.style.setProperty("--tx", `${(-18 + rnd() * 36).toFixed(1)}px`);
    poly.style.setProperty("--ty", `${(-25 - rnd() * 35).toFixed(1)}px`);
    poly.style.setProperty("--rot", `${(-45 + rnd() * 90).toFixed(1)}deg`);
    poly.style.animationDelay = `${(rnd() * 3.5).toFixed(2)}s`;
    poly.style.animationDuration = `${(3.0 + rnd() * 2.5).toFixed(2)}s`;

    fragment.appendChild(poly);
  }
  shardsContainer.appendChild(fragment);

  // 2. Interaksi Klik / Tap: Muncul Gelombang Riak Lingkaran Cyan
  const clickLayer = document.getElementById("p3rClickLayer");
  window.addEventListener("pointerdown", (e) => {
    if (!clickLayer) return;
    const circle = document.createElement("div");
    circle.className = "p3r-click-circle";
    circle.style.left = `${e.clientX}px`;
    circle.style.top = `${e.clientY}px`;
    clickLayer.appendChild(circle);
    setTimeout(() => circle.remove(), 950);
  });
})();
</script>
</body>
</html>
