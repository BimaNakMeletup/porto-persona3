<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Persona 3 Reload - Project Background Frame</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #eef5fc;
    font-family: "Orbitron", system-ui, -apple-system, sans-serif;
    color: #040812;
  }

  /* ===== FULLSCREEN CONTAINER (OPTIMIZED WITH CSS CONTAINMENT) ===== */
  .p3r-project {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    background: #eef5fc;
    isolation: isolate;
    contain: strict;
  }

  .p3r-project svg,
  .p3r-project__char-wrap {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
  }

  /* ===== 1. DIAGONAL SLASH LIGHT BEAM PULSE ===== */
  .p3r-slash-beam {
    will-change: opacity, transform;
    animation: p3r-slash-pulse 4s ease-in-out infinite alternate;
  }

  @keyframes p3r-slash-pulse {
    0% {
      opacity: 0.65;
      stroke-width: 2px;
    }
    100% {
      opacity: 1;
      stroke-width: 3.5px;
    }
  }

  /* ===== 2. WATER SURFACE CAUSTIC RIPPLE ===== */
  .p3r-ocean-caustic {
    will-change: transform, opacity;
    animation: p3r-caustic-drift 6s ease-in-out infinite alternate;
  }

  @keyframes p3r-caustic-drift {
    0% {
      transform: translate3d(0, 0, 0) scale(1);
      opacity: 0.7;
    }
    100% {
      transform: translate3d(12px, -8px, 0) scale(1.02);
      opacity: 0.95;
    }
  }

  /* ===== 3. OCEAN SWELL / ARUS LAUT FLOATING ANIMATION ===== */
  .p3r-project__char-wrap {
    position: absolute;
    left: -2%;
    right: -2%;
    top: -4%;
    bottom: 4%;
    height: 100%;
    pointer-events: none;
    z-index: 5;
    will-change: transform;
    transform-origin: 50% 15%;
    animation: p3r-ocean-current-drift 7.5s cubic-bezier(0.44, 0.05, 0.25, 0.95) infinite;
  }

  @keyframes p3r-ocean-current-drift {
    0% {
      transform: translate3d(0, 0, 0) rotate(0deg);
    }
    25% {
      /* Terayun terbawa arus ke kanan-bawah */
      transform: translate3d(8px, 6px, 0) rotate(0.85deg);
    }
    50% {
      /* Titik rendam terdalam arus laut */
      transform: translate3d(0, 11px, 0) rotate(0deg);
    }
    75% {
      /* Terangkat dan berayun ke kiri */
      transform: translate3d(-8px, 5px, 0) rotate(-0.75deg);
    }
    100% {
      transform: translate3d(0, 0, 0) rotate(0deg);
    }
  }
  .p3r-project__char {
    position: absolute;
    left: 0;
    top: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center top;
    pointer-events: none;
    user-select: none;
  }
  /* Responsive Tablet & Mobile (Karakter Utuh Tanpa Terpotong) */
  @media (max-width: 1024px) {
    .p3r-project__char-wrap {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }
    .p3r-project__char {
      position: absolute;
      right: -2%;
      top: 50%;
      transform: translateY(-50%);
      height: 85vh;
      max-height: 880px;
      width: auto;
      max-width: none;
      object-fit: contain;
    }
  }
  @media (max-width: 767px) {
    .p3r-project__char {
      right: auto;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      height: 80vh;
      max-height: 700px;
      opacity: 0.65;
    }
  }

  /* ===== 4. FLOATING PRISM SHARDS & ROSE PETALS ===== */
  .p3r-shard {
    transform-box: fill-box;
    transform-origin: center center;
    will-change: transform, opacity;
    animation: p3r-shard-drift 4.2s ease-in-out infinite;
  }

  @keyframes p3r-shard-drift {
    0%, 100% {
      transform: translate3d(0, 0, 0) rotate(0deg);
      opacity: 0.85;
    }
    50% {
      transform: translate3d(var(--tx, 8px), var(--ty, -24px), 0) rotate(var(--rot, 25deg));
      opacity: 0.35;
    }
  }

  /* Shard / Petal Colors */
  .shard-rose   { fill: #ff1776; }
  .shard-cyan   { fill: #00e5ff; }
  .shard-white  { fill: #ffffff; }
  .shard-violet { fill: #b388ff; }

  /* ===== 5. UNDERWATER RISING BUBBLES / LIGHT MOTES ===== */
  .p3r-ocean-bubble {
    will-change: transform, opacity;
    animation: p3r-bubble-float var(--dur, 6s) ease-in infinite;
  }

  @keyframes p3r-bubble-float {
    0% {
      transform: translate3d(0, 0, 0);
      opacity: 0;
    }
    20% {
      opacity: var(--op, 0.7);
    }
    85% {
      opacity: var(--op, 0.7);
    }
    100% {
      transform: translate3d(var(--drift, 14px), -240px, 0);
      opacity: 0;
    }
  }
  /* ===== 5. EVOKER PISTOL BARREL GLINT ===== */
  .p3r-evoker-glint {
    transform-origin: 660px 85px;
    animation: p3r-glint-flash 4s ease-in-out infinite;
  }

  @keyframes p3r-glint-flash {
    0%, 82%, 100% {
      opacity: 0;
      transform: scale(0.2) rotate(0deg);
    }
    89% {
      opacity: 1;
      transform: scale(1.2) rotate(45deg);
    }
    94% {
      opacity: 0.35;
      transform: scale(0.6) rotate(90deg);
    }
  }
</style>
</head>
<body>

<section class="p3r-project" aria-label="Persona 3 Reload - Project Background Frame">

  <!-- Layer 1: Background SVG (Kanvas Putih + Prisma Samudra Biru Tua + Garis Tebasan Cahaya + Kaustik) -->
  <svg class="p3r-project__back" viewBox="0 0 1280 720" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
    <defs>
      <!-- Moonlight Ice-Silver Canvas Gradient (Elegan, Dingin & Menyatu dengan Palet P3R) -->
      <linearGradient id="p3r-canvas-ice" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#f8fbff"/>
        <stop offset="35%" stop-color="#edf4fc"/>
        <stop offset="70%" stop-color="#dfecf8"/>
        <stop offset="100%" stop-color="#d0e2f4"/>
      </linearGradient>

      <!-- Soft Cyan Ambient Glow Radiance dari Prisma ke Kanvas -->
      <radialGradient id="p3r-cyan-radiance" cx="0.45" cy="0.4" r="0.65">
        <stop offset="0%" stop-color="#00d4ff" stop-opacity="0.14"/>
        <stop offset="50%" stop-color="#0099e6" stop-opacity="0.06"/>
        <stop offset="100%" stop-color="#d0e2f4" stop-opacity="0"/>
      </radialGradient>

      <!-- Pola Garis Halus Pinstripe Es (Persona Minimalist Geometric Lines) -->
      <pattern id="p3r-ice-stripes" width="28" height="28" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
        <line x1="0" y1="0" x2="0" y2="28" stroke="#005088" stroke-width="0.8" stroke-opacity="0.045"/>
      </pattern>

      <!-- Deep Indigo Oceanic Gradient -->
      <linearGradient id="p3r-indigo-ocean" x1="0" y1="0" x2="0.6" y2="1">
        <stop offset="0%" stop-color="#001452"/>
        <stop offset="45%" stop-color="#00227a"/>
        <stop offset="100%" stop-color="#003db5"/>
      </linearGradient>

      <!-- Water Surface Wave Gradient -->
      <linearGradient id="p3r-ocean-caustic-grad" x1="0" y1="0" x2="1" y2="0.4">
        <stop offset="0%" stop-color="#14c8ff" stop-opacity="0.38"/>
        <stop offset="50%" stop-color="#0099e6" stop-opacity="0.18"/>
        <stop offset="100%" stop-color="#003db5" stop-opacity="0"/>
      </linearGradient>

      <!-- Soft Glow Blur Filter -->
      <filter id="p3r-project-blur" x="-20%" y="-20%" width="140%" height="140%">
        <feGaussianBlur stdDeviation="5"/>
      </filter>

      <!-- Tekstur Halftone Grid Pattern -->
      <pattern id="p3r-project-dots" width="8" height="8" patternUnits="userSpaceOnUse">
        <circle cx="4" cy="4" r="1.3" fill="#000e38"/>
      </pattern>
      <radialGradient id="p3r-project-mask-grad" cx="0.5" cy="0.4" r="0.6">
        <stop offset="0%" stop-color="#fff" stop-opacity="0.7"/>
        <stop offset="70%" stop-color="#fff" stop-opacity="0.25"/>
        <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
      </radialGradient>
      <mask id="p3r-project-texture-mask">
        <rect width="1280" height="720" fill="url(#p3r-project-mask-grad)"/>
      </mask>
    </defs>

    <!-- Base Canvas: Moonlight Ice-Silver Gradient + Ambient Radiance + Pinstripe -->
    <rect width="1280" height="720" fill="url(#p3r-canvas-ice)"/>
    <rect width="1280" height="720" fill="url(#p3r-cyan-radiance)"/>
    <rect width="1280" height="720" fill="url(#p3r-ice-stripes)"/>

    <!-- Prisma Samudra Berlian Biru Tua (Deep Indigo Oceanic Diamond with Crystal Border) -->
    <polygon points="34,0 660,0 1280,320 950,720 0,600 375,300"
             fill="url(#p3r-indigo-ocean)"
             stroke="rgba(140, 225, 255, 0.45)" stroke-width="1.8" stroke-linejoin="round"/>
    <!-- Gelombang Permukaan Air Dalam Prisma -->
    <g class="p3r-ocean-caustic">
      <path d="M 120 40 Q 420 -20 740 60 T 1280 280 L 1280 340 Q 860 120 450 180 T 120 100 Z"
            fill="url(#p3r-ocean-caustic-grad)" filter="url(#p3r-project-blur)"/>
      <path d="M 220 120 Q 560 40 880 140 T 1280 380 L 1280 440 Q 940 220 540 280 T 220 180 Z"
            fill="url(#p3r-ocean-caustic-grad)" filter="url(#p3r-project-blur)" opacity="0.6"/>
    </g>

    <!-- Tekstur Halftone Lembut di Dalam Prisma -->
    <polygon points="34,0 660,0 1280,320 950,720 0,600 375,300"
             fill="url(#p3r-project-dots)" mask="url(#p3r-project-texture-mask)" opacity="0.75"/>

    <!-- Garis Tebasan Cahaya Pedang / Laser Beam (Diagonal Slash) -->
    <g class="p3r-slash-beam">
      <line x1="-50" y1="580" x2="1330" y2="-20" stroke="rgba(160, 230, 255, 0.45)" stroke-width="7"/>
      <line x1="-50" y1="580" x2="1330" y2="-20" stroke="rgba(255, 255, 255, 0.95)" stroke-width="2.5"/>
    </g>

    <!-- Gelembung Cahaya Air Dalam Samudra -->
    <g id="p3rOceanBubbles"></g>
  </svg>

  <!-- Layer 2: Karakter Makoto Yuki dengan Evoker Pistol (project-char.webp dengan Fallback PNG) -->
  <div class="p3r-project__char-wrap">
    <picture>
      <source srcset="project-char.webp" type="image/webp">
      <img class="p3r-project__char" src="project-char.png" alt="Persona 3 Reload Protagonist - Project" decoding="async" fetchpriority="high">
    </picture>
  </div>

  <!-- Layer 3: Foreground Shards Beraneka Warna + Kilatan Evoker -->
  <svg class="p3r-project__front" viewBox="0 0 1280 720" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
    <!-- Kilatan Refleksi Moncong Evoker (Lens Flare Glint) -->
    <g class="p3r-evoker-glint">
      <polygon points="660,75 663,85 673,85 665,90 668,100 660,94 652,100 655,90 647,85 657,85"
               fill="#ffffff"/>
      <circle cx="660" cy="85" r="5" fill="#a4f4ff" opacity="0.9" filter="url(#p3r-project-blur)"/>
    </g>

    <!-- Kelopak Mawar & Serpihan Kristal Melayang (Rose Petals & Prism Shards) -->
    <g id="p3rProjectShards"></g>
  </svg>

</section>

<script>
(() => {
  const NS = "http://www.w3.org/2000/svg";
  let seed = 104;
  const rnd = () => ((seed = (seed * 16807) % 2147483647) - 1) / 2147483646;
  const colorClasses = ["shard-rose", "shard-cyan", "shard-white", "shard-violet"];

  // Serpihan Segitiga & Kelopak Melayang (Rose Petals & Shards)
  const shardsContainer = document.getElementById("p3rProjectShards");
  const fragment = document.createDocumentFragment();

  for (let i = 0; i < 42; i++) {
    const cx = 120 + rnd() * 1080;
    const cy = 50 + rnd() * 620;
    const s = 4 + rnd() * 11;
    const a = rnd() * Math.PI * 2;
    const pt = [0, 2.2, 4.2].map(k => (cx + s * Math.cos(a + k)).toFixed(1) + "," + (cy + s * Math.sin(a + k)).toFixed(1));

    const colorClass = colorClasses[Math.floor(rnd() * colorClasses.length)];
    const poly = document.createElementNS(NS, "polygon");
    poly.setAttribute("points", pt.join(" "));
    poly.setAttribute("fill-opacity", (0.45 + rnd() * 0.45).toFixed(2));
    poly.setAttribute("class", `p3r-shard ${colorClass}`);

    poly.style.setProperty("--tx", `${(-14 + rnd() * 30).toFixed(1)}px`);
    poly.style.setProperty("--ty", `${(-22 - rnd() * 35).toFixed(1)}px`);
    poly.style.setProperty("--rot", `${(-45 + rnd() * 90).toFixed(1)}deg`);
    poly.style.animationDelay = `${(rnd() * 4.0).toFixed(2)}s`;
    poly.style.animationDuration = `${(3.2 + rnd() * 2.5).toFixed(2)}s`;

    fragment.appendChild(poly);
  }
  shardsContainer.appendChild(fragment);

  // Gelembung Cahaya Air Bawah Samudra (26 buah di dalam prisma biru)
  const bubblesContainer = document.getElementById("p3rOceanBubbles");
  if (bubblesContainer) {
    const frag = document.createDocumentFragment();
    for (let i = 0; i < 26; i++) {
      const cx = 350 + rnd() * 650;
      const cy = 250 + rnd() * 420;
      const r = 1.5 + rnd() * 3.5;
      const dur = 4.5 + rnd() * 4.5;
      const delay = rnd() * 5.0;
      const op = 0.35 + rnd() * 0.45;
      const drift = -16 + rnd() * 32;

      const circle = document.createElementNS(NS, "circle");
      circle.setAttribute("cx", cx.toFixed(1));
      circle.setAttribute("cy", cy.toFixed(1));
      circle.setAttribute("r", r.toFixed(1));
      circle.setAttribute("fill", rnd() < 0.4 ? "#ffffff" : "#7fe8ff");
      circle.setAttribute("class", "p3r-ocean-bubble");

      circle.style.setProperty("--dur", `${dur.toFixed(2)}s`);
      circle.style.setProperty("--op", op.toFixed(2));
      circle.style.setProperty("--drift", `${drift.toFixed(1)}px`);
      circle.style.animationDelay = `${delay.toFixed(2)}s`;

      frag.appendChild(circle);
    }
    bubblesContainer.appendChild(frag);
  }
})();
</script>
</body>
</html>
