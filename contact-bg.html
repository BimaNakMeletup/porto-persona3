<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Persona 3 Reload - Animated Frame</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #040812;
    font-family: "Orbitron", system-ui, -apple-system, sans-serif;
    color: #fff;
  }

  /* ===== P3R FULLSCREEN CONTAINER ===== */
  .p3r {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    background: #060b16;
    isolation: isolate;
    contain: strict;
  }
  .p3r svg,
  .p3r__char-wrap {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
  }

  /* ===== KARAKTER MAKOTO YUKI (FLOATING HALUS & SUBTLE) ===== */
  /* ===== KARAKTER MAKOTO YUKI (ANCHORED DI BAWAH & FLOATING HALUS) ===== */
  .p3r__char-wrap {
    position: absolute;
    left: 0;
    right: 0;
    top: 4%;
    bottom: -4%;
    height: 100%;
    pointer-events: none;
    will-change: transform;
    animation: p3r-subtle-float 4.8s ease-in-out infinite alternate;
  }

  @keyframes p3r-subtle-float {
    0% {
      transform: translate3d(0, 0, 0);
    }
    100% {
      transform: translate3d(0, -4px, 0);
    }
  }

  .p3r__char {
    position: absolute;
    right: 0;
    bottom: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: right bottom;
    pointer-events: none;
    user-select: none;
  }
  /* Responsive Tablet & Mobile (Karakter Utuh Tanpa Terpotong) */
  @media (max-width: 1024px) {
    .p3r__char-wrap {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }
    .p3r__char {
      position: absolute;
      right: 0;
      bottom: 0;
      height: 72vh;
      max-height: 750px;
      width: auto;
      max-width: none;
      object-fit: contain;
      transform: translateX(-4%);
    }
  }
  @media (max-width: 767px) {
    .p3r__char {
      right: 0;
      bottom: -10px;
      height: 54vh;
      max-height: 490px;
      transform: translateX(0);
      opacity: 0.7;
    }
  }
  /* ===== 1. Headphone Soundwave Ripple Rings (Beranimasi) ===== */
  .p3r__ripples {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 5;
  }
  .p3r-ring {
    transform-origin: 714px 308px;
    animation: p3r-soundwave 2.4s cubic-bezier(0.1, 0.7, 0.1, 1) infinite;
  }
  .p3r-ring:nth-child(2) { animation-delay: 0.32s; }
  .p3r-ring:nth-child(3) { animation-delay: 0.65s; }
  .p3r-ring:nth-child(4) { animation-delay: 1.2s; }
  .p3r-ring:nth-child(5) { animation-delay: 1.55s; }

  @keyframes p3r-soundwave {
    0% {
      r: 16px;
      stroke-width: 3.5px;
      stroke: #00e5ff;
      opacity: 0.95;
    }
    50% {
      stroke: #00aaff;
      opacity: 0.6;
    }
    100% {
      r: 72px;
      stroke-width: 1px;
      stroke: #0066ff;
      opacity: 0;
    }
  }

  /* ===== 2. Audio Visualizer Equalizer Waveform (Beranimasi) ===== */
  .p3r-wave-bar {
    transform-box: fill-box;
    transform-origin: center center;
    animation: p3r-eq 1.2s ease-in-out infinite alternate;
  }

  @keyframes p3r-eq {
    0% {
      transform: scaleY(0.6);
      opacity: 0.7;
    }
    50% {
      transform: scaleY(var(--scale, 2.0));
      opacity: 1;
    }
    100% {
      transform: scaleY(0.4);
      opacity: 0.55;
    }
  }

  /* ===== 3. Floating Triangle Shards (Beranimasi) ===== */
  .p3r-shard {
    transform-box: fill-box;
    transform-origin: center center;
    animation: p3r-float 3.6s ease-in-out infinite;
  }

  @keyframes p3r-float {
    0%, 100% {
      transform: translate(0, 0) rotate(0deg);
      opacity: 0.75;
    }
    50% {
      transform: translate(var(--tx, -10px), var(--ty, -22px)) rotate(var(--rot, 20deg));
      opacity: 0.3;
    }
  }

  /* ===== 4. Cyan Neon Glow Pulse under RELOAD (Beranimasi) ===== */
  .p3r-glow-pulse {
    animation: p3r-glow 1.8s ease-in-out infinite alternate;
  }

  @keyframes p3r-glow {
    0% {
      opacity: 0.5;
    }
    100% {
      opacity: 0.9;
    }
  }

  /* ===== 5. Hexagon Twinkling (Beranimasi) ===== */
  .p3r-hex-node {
    animation: p3r-hex-twinkle 3s ease-in-out infinite;
  }

  @keyframes p3r-hex-twinkle {
    0%, 100% {
      fill-opacity: var(--base-op, 0.2);
    }
    50% {
      fill-opacity: var(--peak-op, 0.75);
      fill: #2284f5;
    }
  }

  .p3r text { font-family: "Orbitron", "Arial Black", sans-serif; }
</style>
</head>
<body>

<!-- P3R Frame Element -->
<section class="p3r" aria-label="Persona 3 Reload Animated Frame">

  <!-- Layer 1: Background & Teks Vertikal -->
  <svg class="p3r__back" viewBox="0 0 1024 576" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
    <defs>
      <linearGradient id="p3r-base" x1="0" y1="0" x2="1" y2="0.6">
        <stop offset="0" stop-color="#2a9cf0"/>
        <stop offset="0.45" stop-color="#1a7fe0"/>
        <stop offset="1" stop-color="#1462cf"/>
      </linearGradient>
      <pattern id="p3r-dots" width="6" height="6" patternUnits="userSpaceOnUse">
        <circle cx="3" cy="3" r="1.25" fill="#04245c"/>
      </pattern>
      <radialGradient id="p3r-dots-fade" cx="0.55" cy="0.45" r="0.8">
        <stop offset="0" stop-color="#fff" stop-opacity="0.75"/>
        <stop offset="1" stop-color="#fff" stop-opacity="0.45"/>
      </radialGradient>
      <mask id="p3r-dots-mask">
        <rect width="1024" height="576" fill="url(#p3r-dots-fade)"/>
      </mask>
      <filter id="p3r-soft" x="-20%" y="-20%" width="140%" height="140%">
        <feGaussianBlur stdDeviation="6"/>
      </filter>
    </defs>

    <rect width="1024" height="576" fill="url(#p3r-base)"/>

    <!-- blok biru tua bersudut -->
    <g fill="#1d3ee8" opacity="0.85" filter="url(#p3r-soft)">
      <polygon points="680,0 1024,0 1024,230 900,250 820,170 700,120"/>
      <polygon points="600,420 700,400 720,576 590,576"/>
    </g>

    <rect width="1024" height="576" fill="url(#p3r-dots)" mask="url(#p3r-dots-mask)"/>

    <!-- garis outline tipis -->
    <g fill="none" stroke="#b8e0ff" stroke-opacity="0.55" stroke-width="1.6" stroke-linejoin="round">
      <rect x="602" y="330" width="46" height="190" rx="6"/>
      <rect x="612" y="342" width="26" height="166" rx="4"/>
      <path d="M720 40 H800 Q812 40 812 52 V200 H760"/>
      <path d="M732 54 H796 V186"/>
      <path d="M560 90 V20 H660"/>
    </g>

    <!-- teks vertikal kanan atas (di belakang karakter) -->
    <g fill="none" stroke-linejoin="round">
      <text transform="translate(932 4) rotate(90)" font-size="58" font-weight="900"
            letter-spacing="2" stroke="#fff" stroke-width="3">PORTOFOLIO</text>
      <text transform="translate(850 30) rotate(90)" font-size="50" font-weight="900"
            letter-spacing="10" stroke="#cfe9ff" stroke-opacity="0.85" stroke-width="2">P3R</text>
      <text transform="translate(800 20) rotate(90)" font-size="50" font-weight="900"
            letter-spacing="10" stroke="#cfe9ff" stroke-opacity="0.35" stroke-width="1.5">P3R</text>
    </g>
  </svg>

  <!-- Layer 2: Karakter Makoto Yuki + Riak Suara (Floating Halus & Alami) -->
  <div class="p3r__char-wrap">
    <picture>
      <source srcset="contact-char.webp" type="image/webp">
      <img class="p3r__char" src="contact-char.png" alt="Persona 3 Protagonist" decoding="async" fetchpriority="high">
    </picture>

    <!-- Gelombang Riak Suara Headphone (Mengikuti posisi karakter saat floating) -->
    <svg class="p3r__ripples" viewBox="0 0 1024 576" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
      <circle cx="714" cy="308" r="18" fill="none" class="p3r-ring"/>
      <circle cx="714" cy="308" r="18" fill="none" class="p3r-ring"/>
      <circle cx="714" cy="308" r="18" fill="none" class="p3r-ring"/>
      <circle cx="714" cy="308" r="18" fill="none" class="p3r-ring"/>
      <circle cx="714" cy="308" r="18" fill="none" class="p3r-ring"/>
    </svg>
  </div>
  <!-- Layer 3: Layer Depan (Panel gelap, hexagon, glow, visualizer, logo P3, serpihan) -->
  <svg class="p3r__front" viewBox="0 0 1024 576" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
    <defs>
      <linearGradient id="p3r-panel" x1="0" y1="0" x2="0.4" y2="1">
        <stop offset="0" stop-color="#070b14"/>
        <stop offset="1" stop-color="#0b1424"/>
      </linearGradient>
      <clipPath id="p3r-panel-clip">
        <polygon points="0,0 41,0 440,576 0,576"/>
      </clipPath>
      <radialGradient id="p3r-hex-fade" cx="0.05" cy="0.95" r="0.9">
        <stop offset="0" stop-color="#fff" stop-opacity="1"/>
        <stop offset="0.6" stop-color="#fff" stop-opacity="0.45"/>
        <stop offset="1" stop-color="#fff" stop-opacity="0.15"/>
      </radialGradient>
      <mask id="p3r-hex-mask">
        <rect width="1024" height="576" fill="url(#p3r-hex-fade)"/>
      </mask>
      <linearGradient id="p3r-glow" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0" stop-color="#1a8cff" stop-opacity="0"/>
        <stop offset="0.55" stop-color="#2fb0ff" stop-opacity="0.9"/>
        <stop offset="0.85" stop-color="#bff0ff"/>
        <stop offset="1" stop-color="#ffffff"/>
      </linearGradient>
    </defs>

    <!-- panel gelap diagonal -->
    <polygon points="0,0 41,0 440,576 0,576" fill="url(#p3r-panel)"/>
    <g id="p3r-hex" clip-path="url(#p3r-panel-clip)" mask="url(#p3r-hex-mask)"></g>

    <!-- glow cyan berdenyut di belakang teks RELOAD -->
    <g class="p3r-glow-pulse">
      <rect x="70" y="186" width="160" height="36" fill="url(#p3r-glow)"/>
      <rect x="110" y="192" width="110" height="24" fill="url(#p3r-glow)"/>
    </g>

    <!-- gelombang visualizer audio (berdenyut dinamis) -->
    <g id="p3r-wave" fill="none" stroke="#fff" stroke-width="1.5"></g>

    <!-- logo P3 -->
    <g fill="none" stroke-linejoin="round">
      <g stroke="#fff" stroke-width="17">
        <path d="M76 118 V38 H150 Q162 38 162 50 V66 Q162 78 150 78 H76"/>
        <path d="M184 38 H274 Q288 38 288 50 V106 Q288 118 274 118 H184 M206 78 H288"/>
      </g>
      <g stroke="#060b16" stroke-width="2.5">
        <path d="M76 118 V38 H150 Q162 38 162 50 V66 Q162 78 150 78 H76"/>
        <path d="M184 38 H274 Q288 38 288 50 V106 Q288 118 274 118 H184 M206 78 H288"/>
      </g>
    </g>
    <text x="44" y="172" font-size="31" font-weight="400" fill="#fff" stroke="#fff" stroke-width="0.6"
          textLength="266" lengthAdjust="spacingAndGlyphs">MYWEB</text>

    <!-- serpihan segitiga melayang & berputar -->
    <g id="p3r-shards" fill="#9ad8ff"></g>
  </svg>
</section>

<script>
(() => {
  const NS = "http://www.w3.org/2000/svg";
  let seed = 7;
  const rnd = () => ((seed = (seed * 16807) % 2147483647) - 1) / 2147483646;
  const el = (tag, attrs, parent) => {
    const n = document.createElementNS(NS, tag);
    for (const k in attrs) n.setAttribute(k, attrs[k]);
    parent.appendChild(n);
    return n;
  };

  // 1. Honeycomb hexagon dengan animasi twinkle
  const hexG = document.getElementById("p3r-hex");
  const R = 15, A = R - 2.2, H = Math.sqrt(3) * R;
  for (let col = 0; col * 1.5 * R < 460; col++) {
    const cx = col * 1.5 * R;
    for (let row = -1; row * H < 600; row++) {
      const cy = row * H + (col % 2 ? H / 2 : 0);
      const pts = [];
      for (let i = 0; i < 6; i++) {
        const a = Math.PI / 3 * i;
        pts.push((cx + A * Math.cos(a)).toFixed(1) + "," + (cy + A * Math.sin(a)).toFixed(1));
      }
      const isAnimated = rnd() < 0.28;
      const baseOp = (0.15 + rnd() * 0.25).toFixed(2);
      const peakOp = (0.6 + rnd() * 0.35).toFixed(2);
      const delay = (rnd() * 3.5).toFixed(2);
      const dur = (2.2 + rnd() * 2.0).toFixed(2);

      const poly = el("polygon", {
        points: pts.join(" "),
        fill: isAnimated ? "#1f6cd8" : "#123a78",
        "fill-opacity": baseOp,
        class: isAnimated ? "p3r-hex-node" : ""
      }, hexG);

      if (isAnimated) {
        poly.style.setProperty("--base-op", baseOp);
        poly.style.setProperty("--peak-op", peakOp);
        poly.style.animationDelay = `${delay}s`;
        poly.style.animationDuration = `${dur}s`;
      }
    }
  }

  // 2. Gelombang audio visualizer yang berdenyut dinamis
  const wave = document.getElementById("p3r-wave");
  const x0 = 204, y0 = 228, x1 = 446, y1 = 572;
  const len = Math.hypot(x1 - x0, y1 - y0), step = 10.5;
  const nx = (y1 - y0) / len, ny = -(x1 - x0) / len;
  let idx = 0;
  for (let d = 0; d <= len; d += step) {
    const t = d / len;
    const loud = t > 0.78 ? 0.6 : t > 0.45 ? 0.3 : 0.15;
    const isBar = rnd() < loud;
    const h = isBar ? 8 + rnd() * (t > 0.78 ? 24 : 12) : 6;
    const off = 6 + (rnd() - 0.5) * 3;
    const cx = x0 + (x1 - x0) * t + nx * off;
    const cy = y0 + (y1 - y0) * t + ny * off;

    const rect = el("rect", {
      x: (cx - 3).toFixed(1),
      y: (cy - h / 2).toFixed(1),
      width: 6,
      height: h.toFixed(1),
      rx: 3,
      class: isBar ? "p3r-wave-bar" : ""
    }, wave);

    if (isBar) {
      rect.style.setProperty("--scale", (1.5 + rnd() * 1.8).toFixed(2));
      rect.style.animationDelay = `${(idx * 0.08).toFixed(2)}s`;
      rect.style.animationDuration = `${(0.8 + rnd() * 0.8).toFixed(2)}s`;
    }

    if (t > 0.5 && rnd() < 0.28) {
      const dot = el("rect", {
        x: (cx + nx * 9 - 2.5).toFixed(1),
        y: (cy + ny * 9 - 2.5).toFixed(1),
        width: 5,
        height: 5,
        rx: 2.5,
        class: "p3r-wave-bar"
      }, wave);
      dot.style.setProperty("--scale", (1.4 + rnd() * 1.2).toFixed(2));
      dot.style.animationDelay = `${(idx * 0.1).toFixed(2)}s`;
    }
    idx++;
  }

  // 3. Serpihan segitiga melayang & berputar lembut
  const shards = document.getElementById("p3r-shards");
  for (let i = 0; i < 28; i++) {
    const cx = 680 + rnd() * 340, cy = 250 + rnd() * 326, s = 3 + rnd() * 10;
    const a = rnd() * Math.PI * 2;
    const pt = [0, 2.2, 4.2].map(k => (cx + s * Math.cos(a + k)).toFixed(1) + "," + (cy + s * Math.sin(a + k)).toFixed(1));
    const poly = el("polygon", {
      points: pt.join(" "),
      "fill-opacity": (0.4 + rnd() * 0.5).toFixed(2),
      class: "p3r-shard"
    }, shards);

    poly.style.setProperty("--tx", `${(-15 + rnd() * 30).toFixed(1)}px`);
    poly.style.setProperty("--ty", `${(-25 - rnd() * 30).toFixed(1)}px`);
    poly.style.setProperty("--rot", `${(-40 + rnd() * 80).toFixed(1)}deg`);
    poly.style.animationDelay = `${(rnd() * 3).toFixed(2)}s`;
    poly.style.animationDuration = `${(2.8 + rnd() * 2.2).toFixed(2)}s`;
  }
})();
</script>
</body>
</html>
